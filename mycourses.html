<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Course</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            background-color: #f4f7f9;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #007bff;
            color: white;
            padding: 15px 0;
        }

        .navbar-brand {
            font-size: 1.5em;
        }

        .main-video {
            background: #fff;
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .quiz-section {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .quiz-section h2 {
            margin-top: 0;
        }

        .quiz-section .form-group {
            margin-bottom: 15px;
        }

        .upcoming-videos {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .upcoming-videos h2 {
            margin-top: 0;
        }

        .upcoming-videos a {
            text-decoration: none;
            color: #007bff;
        }

        .upcoming-videos a:hover {
            text-decoration: underline;
        }

        footer {
            background-color: #007bff;
            color: white;
            padding: 15px 0;
            text-align: center;
            position: relative;
            bottom: 0;
            width: 100%;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .col-md-8,
            .col-md-4 {
                width: 100%;
                margin-bottom: 20px;
            }
        }
    </style>
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <a class="navbar-brand" href="#">Academics</a>
        </nav>
    </header>
    <main class="container mt-4">
        <div class="row">
            <!-- Main Video and Quiz Section -->
            <div class="col-md-8">
                <div class="main-video mb-4">
                    <video controls width="100%">
                        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                </div>
                <div class="quiz-section mt-4 p-3 border rounded">
                    <h2>Quiz</h2>
                    <form>
                        <div class="form-group">
                            <label for="question1">1. What is the main topic of this video?</label>
                            <input type="text" class="form-control" id="question1" placeholder="Your answer">
                        </div>
                        <div class="form-group">
                            <label for="question2">2. What is the first key point discussed?</label>
                            <input type="text" class="form-control" id="question2" placeholder="Your answer">
                        </div>
                        <div class="form-group">
                            <label for="question3">3. List one important detail.</label>
                            <input type="text" class="form-control" id="question3" placeholder="Your answer">
                        </div>
                        <div class="form-group">
                            <label for="question4">4. What is the conclusion of the video?</label>
                            <input type="text" class="form-control" id="question4" placeholder="Your answer">
                        </div>
                        <div class="form-group">
                            <label for="question5">5. How can you apply what you learned?</label>
                            <input type="text" class="form-control" id="question5" placeholder="Your answer">
                        </div>
                        <button type="submit" class="btn btn-primary">Submit</button>
                    </form>
                </div>
            </div>
            <!-- Upcoming Videos Section -->
            <div class="col-md-4">
                <div class="upcoming-videos p-3 border rounded">
                    <h2>Upcoming Videos</h2>
                    <ul class="list-unstyled">
                        <li class="mb-3">
                            <a href="#" class="text-dark">Upcoming Video 1</a>
                            <p class="text-muted">Date: 2024-09-01</p>
                        </li>
                        <li class="mb-3">
                            <a href="#" class="text-dark">Upcoming Video 2</a>
                            <p class="text-muted">Date: 2024-09-08</p>
                        </li>
                        <li class="mb-3">
                            <a href="#" class="text-dark">Upcoming Video 3</a>
                            <p class="text-muted">Date: 2024-09-15</p>
                        </li>
                        <!-- Add more upcoming videos as needed -->
                    </ul>
                </div>
            </div>
        </div>
    </main>
    <footer class="bg-light text-center py-3">
        <p>&copy; 2024 Academics. All rights reserved.</p>
    </footer>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>

</html>
